
<style>
*{box-sizing:border-box;margin:0;padding:0;}
.root{padding:1rem 0;font-family:var(--font-sans);}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:1.25rem;}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text-secondary);}
.ldot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.modules{display:flex;flex-direction:column;gap:8px;}
.mod{border:0.5px solid var(--border);border-radius:10px;overflow:hidden;}
.mod-header{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;background:var(--surface-1);user-select:none;}
.mod-header:hover{background:var(--surface-0);}
.mod-num{font-size:11px;font-weight:500;color:var(--text-muted);min-width:16px;}
.mod-title{font-size:13px;font-weight:500;color:var(--text-primary);flex:1;}
.mod-tag{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;}
.tag-ok{background:var(--bg-success);color:var(--text-success);}
.tag-new{background:var(--bg-accent);color:var(--text-accent);}
.tag-revised{background:var(--bg-warning);color:var(--text-warning);}
.chev{font-size:11px;color:var(--text-muted);transition:transform .2s;}
.chev.open{transform:rotate(90deg);}
.mod-body{display:none;padding:10px 14px 14px;border-top:0.5px solid var(--border);background:var(--surface-2);}
.mod-body.open{display:block;}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;}
.group{background:var(--surface-1);border:0.5px solid var(--border);border-radius:8px;padding:10px 12px;}
.g-title{font-size:12px;font-weight:500;color:var(--text-primary);margin-bottom:6px;}
.g-items{display:flex;flex-direction:column;gap:3px;}
.gi{font-size:11px;color:var(--text-secondary);display:flex;align-items:flex-start;gap:5px;line-height:1.4;}
.gi .dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;margin-top:4px;}
.dot-ok{background:#4caf50;}
.dot-new{background:#1976d2;}
.dot-fix{background:#ff9800;}
.note{margin-top:8px;font-size:11px;color:var(--text-muted);background:var(--surface-0);border-radius:6px;padding:7px 10px;border-left:2px solid var(--border-strong);line-height:1.5;}
.note.warn{border-left-color:#ff9800;}
.note.info{border-left-color:#1976d2;}
.note.ok{border-left-color:#4caf50;}
</style>

</div>

function render(){
  const el=document.getElementById('mods');
  data.forEach((m,i)=>{
    const div=document.createElement('div');
    div.className='mod';
    const tagClass=m.tag==='ok'?'tag-ok':m.tag==='new'?'tag-new':'tag-revised';
    let groupsHtml=m.groups.map(g=>`
      <div class="group">
        <div class="g-title">${g.title}</div>
        <div class="g-items">
          ${g.items.map(it=>`<div class="gi"><div class="dot dot-${it.d}"></div><span>${it.t}</span></div>`).join('')}
        </div>
      </div>`).join('');
    const noteClass=m.note?m.note.type:'info';
    const noteHtml=m.note?`<div class="note ${noteClass}" style="margin-top:10px">${m.note.text}</div>`:'';
    div.innerHTML=`
      <div class="mod-header" onclick="toggle(this)">
        <span class="mod-num">${m.num}.</span>
        <span class="mod-title">${m.title}</span>
        <span class="mod-tag ${tagClass}">${m.tagLabel}</span>
        <span class="chev">▶</span>
      </div>
      <div class="mod-body">
        <div class="cols">${groupsHtml}</div>
        ${noteHtml}
      </div>`;
    el.appendChild(div);
  });
}
function toggle(header){
  const body=header.nextElementSibling;
  const chev=header.querySelector('.chev');
  const isOpen=body.classList.contains('open');
  body.classList.toggle('open',!isOpen);
  chev.classList.toggle('open',!isOpen);
}
render();
